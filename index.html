const tabs=document.getElementById('tabs');
tabs.innerHTML+=Object.entries(d).map(([id,x])=>`<button class="tab" data-page="${id}" onclick="go('${id}')"><span class="mini-flag">${x.f}</span>${x.short}</button>`).join('');

const mapLink=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const photoBlock=(name,url)=>url?`<div class="photo"><img src="${url}" alt="${name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='<div class=\'photo-placeholder\'><div class=\'cam\'>📷</div><span>Photo unavailable</span></div>'"></div>`:`<div class="photo"><div class="photo-placeholder"><div class="cam">📷</div><span>Photo to add</span></div></div>`;

const attractionCard=(a,i,id)=>`<article class="attraction-card">
${photoBlock(a[0],photos[id].attractions[i])}<div class="rank">${i+1}</div>
<div class="attraction-body"><div class="attraction-title">${a[0]}</div>
<div class="meta"><div class="meta-row"><b>Address</b><span>${a[1]}</span></div><div class="meta-row"><b>Notes</b><span>${a[2]}</span></div></div>
<div class="actions"><a class="btn primary" href="${mapLink(a[0]+' '+a[1])}" target="_blank">📍 Directions</a>${a[3]?`<a class="btn" href="${a[3]}" target="_blank">↗ Official website</a>`:`<button class="btn disabled">↗ Website to add</button>`}</div>
</div></article>`;

const restaurantCard=r=>`<article class="restaurant"><div class="restaurant-name">${r[0]}</div>
<div class="meta"><div class="meta-row"><b>Address</b><span>${r[1]}</span></div><div class="meta-row"><b>Try</b><span>${r[2]}</span></div><div class="meta-row"><b>Price</b><span>${r[3]}</span></div><div class="meta-row"><b>Notes</b><span>${r[4]}</span></div></div>
<div class="actions"><a class="btn" href="${mapLink(r[0]+' '+r[1])}" target="_blank">📍 Map</a></div></article>`;

document.getElementById('pages').innerHTML=Object.entries(d).map(([id,x])=>`
<section id="${id}" class="page">
<div class="destination-hero ${x.theme}"><div class="city-flag">${x.f}</div><h1>${x.t}</h1><p>${x.date}</p></div>
<div class="wrap">
<div class="section-head first"><h2>Trip essentials</h2><span>Most important info</span></div>
<div class="primary-grid">
  <div class="card hotel-card">${photoBlock(x.hotel[0],photos[id].hotel)}<div class="hotel-body"><div class="label">🏨 Where we're staying</div><div class="hotel-name">${x.hotel[0]}</div><div class="hotel-address">📍 ${x.hotel[1]}</div><div class="status">${x.hotel[2]}</div><div class="actions"><a class="btn primary" href="${mapLink(x.hotel[0]+' '+x.hotel[1])}" target="_blank">📍 Directions</a><button class="btn disabled">🎫 Booking documents</button></div></div></div>
  <div class="card todo-card"><div class="todo-head"><div><div class="label">✅ To-do list</div><div class="small">Before & during this stop</div></div><div class="counter">${x.tasks.length} items</div></div>${x.tasks.map((v,i)=>`<label class="check-row"><input type="checkbox" data-key="${id}-task-${i}"><span class="check-copy"><b>${v[0]}</b><span>${v[1]}</span></span></label>`).join('')}</div>
</div>

<div class="section-head"><h2>✨ Top 5 things to do</h2><span>Family highlights</span></div>
<div class="attractions">${x.attractions.map((a,i)=>attractionCard(a,i,id)).join('')}</div>

<div class="section-head"><h2>🚐 Transfers</h2><span>Flights & ground transport</span></div>
<div class="transfer-grid">${x.transfers.map(v=>`<div class="transfer-item"><div class="transfer-title">${v[0]}</div><div class="transfer-note">${v[1]}</div></div>`).join('')}</div>

<div class="section-head"><h2>🍜 Places to eat</h2><span>Saved food spots</span></div>
<div class="restaurant-list">${x.restaurants.map(restaurantCard).join('')}</div>
<div class="actions"><button class="btn" onclick="coming('Add restaurant')">＋ Add restaurant</button></div>

<div class="section-head"><h2>🗺️ Map</h2><span>Everything in one place</span></div>
<div class="card map-card"><div class="map-visual">📍</div><div class="map-copy">Open this destination in Google Maps or jump straight to the hotel. A custom map with every saved attraction and restaurant can be added next.</div><div class="actions"><a class="btn primary" href="${mapLink(x.t)}" target="_blank">Open ${x.short} in Google Maps</a><a class="btn" href="${mapLink(x.hotel[0])}" target="_blank">Hotel</a></div></div>
</div></section>`).join('');

function updateMelbourneClock(){
  const el=document.getElementById('melTime');
  if(!el)return;
  el.textContent=new Intl.DateTimeFormat('en-AU',{timeZone:'Australia/Melbourne',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date());
}
updateMelbourneClock();
setInterval(updateMelbourneClock,30000);

function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===id));const active=document.querySelector('.tab.active');if(active)active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});window.scrollTo({top:0,behavior:'smooth'})}
function coming(name){alert(name+" can be added next.");}
document.addEventListener('change',e=>{if(e.target.matches('input[type=checkbox][data-key]'))localStorage.setItem(e.target.dataset.key,e.target.checked?'1':'0')});
document.querySelectorAll('input[type=checkbox][data-key]').forEach(cb=>cb.checked=localStorage.getItem(cb.dataset.key)==='1');
</script>
</body>
</html>
